name: Publicar imagem BTC Sinais Semanais
on:
  push:
    branches: [main]
    paths:
      - "neutralis-btc-alerta/**"
      - ".github/workflows/publish-btc-alerta.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar código
        run: |
          python3 - <<'PY'
          for path in ('neutralis-btc-alerta/app/engine.py', 'neutralis-btc-alerta/app/server.py'):
              compile(open(path).read(), path, 'exec')
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: neutralis-btc-alerta/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/rhstuff01/neutralis-btc-alerta:0.1.0
          provenance: mode=max
          sbom: true

services:
  app_proxy:
    environment:
      APP_HOST: neutralis-btc-alerta_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/rhstuff01/neutralis-btc-alerta:0.1.1
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      APP_DATA_DIR: /data
    security_opt:
      - no-new-privileges:true

services:
  neutralis:
    build:
      context: .
    image: neutralis-umbrel:0.2.0
    container_name: neutralis
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      PORT: "8787"
      NEUTRALIS_DATA_DIR: /data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

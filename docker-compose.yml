services:
  app_proxy:
    environment:
      APP_HOST: neutralis_server_1
      APP_PORT: 8787

  server:
    build:
      context: .
    image: neutralis-umbrel:0.2.1
    container_name: neutralis_server_1
    restart: on-failure
    stop_grace_period: 15s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      PORT: "8787"
      NEUTRALIS_DATA_DIR: /data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

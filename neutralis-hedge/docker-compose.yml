services:
  app_proxy:
    environment:
      APP_HOST: neutralis-hedge_server_1
      APP_PORT: 8787

  server:
    image: ghcr.io/rhstuff01/neutralis-umbrel:0.1.0
    restart: on-failure
    stop_grace_period: 15s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      PORT: "8787"
      NEUTRALIS_DATA_DIR: /data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
